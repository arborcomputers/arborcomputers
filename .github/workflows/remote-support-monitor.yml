# Checks the live Remote Support download every hour, around the clock, and after
# every push to main. If it breaks, this opens a GitHub issue titled
# "Remote support download is broken" (GitHub emails the repo admins), and closes
# that issue on its own once the download works again.
name: Remote support monitor

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: remote-support-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE: https://arborcomputers.com
    steps:
      - uses: actions/checkout@v5

      - name: Wait for the new deploy (push only)
        if: github.event_name == 'push'
        run: sleep 120

      - name: Check live site and helper
        run: |
          set -u
          fail() { echo "::error::$1"; echo "$1" >> problems.txt; }
          get() { curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors --max-time 30 "$@"; }

          page=$(curl -fsSL --retry 3 --retry-all-errors --max-time 30 "$SITE/remote-support/") || fail "The Remote Support page is down"
          echo "$page" | grep -q 'startcontrol.com/pin.php' || fail "The Remote Support page lost the StartControl form"
          for js in $(echo "$page" | grep -oE '/_next/static/[^"\\]+\.js' | sort -u); do
            code=$(get "$SITE$js"); [ "$code" = 200 ] || fail "Page script $js returns $code"
          done

          # The helper only accepts POST: 405 means it exists, 404 means customers can't download.
          code=$(get "$SITE/api/remote-support/")
          [ "$code" = 405 ] || fail "Download helper /api/remote-support/ returns $code (expected 405)"
          body=$(curl -s -X POST --retry 3 --max-time 30 "$SITE/api/remote-support/" -H 'content-type: application/x-www-form-urlencoded' --data '')
          echo "$body" | grep -q '"ok":false' || fail "Download helper gave an unexpected reply: $body"

          # StartControl's own side (we don't control it, but we want to know first).
          code=$(get -L https://startcontrol.com/pin.php)
          [ "$code" = 200 ] || fail "StartControl's portal (startcontrol.com/pin.php) returns $code"

          [ ! -s problems.txt ] || exit 1
          echo "Site and helper OK."

      - name: Test the page in a real browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          node scripts/monitor-remote-support.mjs "$SITE" 2> browser.txt || { cat browser.txt; cat browser.txt >> problems.txt; exit 1; }

      - name: Open an issue (download broken)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Remote support download is broken"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          details=$(cat problems.txt 2>/dev/null || echo "See the run log.")
          body=$(printf 'The hourly check found a problem with https://arborcomputers.com/remote-support/\n\n```\n%s\n```\n\nRun: %s\n\nWhile this is open, send customers to https://startcontrol.com/pin.php. This issue closes itself once the check passes again.' "$details" "$run_url")
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body "Still failing: $run_url"; else gh issue create --title "$title" --body "$body"; fi

      - name: Close the issue (download working again)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for num in $(gh issue list --state open --search '"Remote support download is broken" in:title' --json number --jq '.[].number'); do
            gh issue close "$num" --comment "Fixed: the remote support download works again."
          done

      # GitHub turns off scheduled checks after 60 days without repo activity; this keeps it on.
      - name: Keep this monitor switched on
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/remote-support-monitor.yml/enable" || true
